name: Deploy Blog to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy static files via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p "$SSH_PORT" "${SSH_USER}@${SSH_HOST}" "mkdir -p /home/${SSH_USER}/mustafa-ayverdi-blog/site"

          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.agents' \
            --exclude='tests' \
            --exclude='gemini.md' \
            -e "ssh -o IdentitiesOnly=yes -i ~/.ssh/deploy_key -p ${SSH_PORT}" \
            ./ "${SSH_USER}@${SSH_HOST}:/home/${SSH_USER}/mustafa-ayverdi-blog/site/"

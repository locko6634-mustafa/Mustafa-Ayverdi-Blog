name: Deploy Blog to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Run checks (syntax + smoke tests)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          js_files=(js/*.js)
          if [ "${#js_files[@]}" -eq 0 ]; then
            echo "::error::js/ altında .js dosyası bulunamadı; sözdizimi kontrolü yapılamadı."
            exit 1
          fi
          for f in "${js_files[@]}"; do node --check --input-type=module < "$f" || exit 1; done
          node --test tests/smoke.test.mjs

      - name: Validate deploy target
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_USER}" ] || ! [[ "${SSH_USER}" =~ ^[a-z_][a-z0-9_-]*$ ]]; then
            echo "::error::SERVER_USER boş veya geçersiz biçimde; deploy durduruldu."
            exit 1
          fi
          if [ -z "${SSH_HOST}" ]; then
            echo "::error::SERVER_HOST boş; deploy durduruldu."
            exit 1
          fi
          if [ ! -f ./index.html ]; then
            echo "::error::Kaynakta index.html yok; rsync --delete çalıştırılmayacak."
            exit 1
          fi

      - name: Deploy static files via rsync over SSH
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          # Port doğrulaması (yalnız rakam, 1-65535)
          if ! [[ "${SSH_PORT}" =~ ^[0-9]{1,5}$ ]] || [ "$((10#${SSH_PORT}))" -lt 1 ] || [ "$((10#${SSH_PORT}))" -gt 65535 ]; then
            echo "::error::SERVER_PORT geçersiz (1-65535 arası sayı olmalı); deploy durduruldu."
            exit 1
          fi
          SSH_PORT="$((10#${SSH_PORT}))"

          # Host anahtarı sabitlenmeli; TOFU (ssh-keyscan) yok
          if [ -z "${SSH_KNOWN_HOSTS}" ]; then
            echo "::error::SERVER_KNOWN_HOSTS secret'ı tanımlı değil; host anahtarı doğrulanamadan deploy yapılmaz."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key)
          chmod 600 ~/.ssh/deploy_key
          (umask 077 && printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts)
          chmod 600 ~/.ssh/known_hosts

          KEY_FILE="$HOME/.ssh/deploy_key"
          KNOWN_HOSTS_FILE="$HOME/.ssh/known_hosts"
          SSH_OPTS=(
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${KNOWN_HOSTS_FILE}"
            -i "${KEY_FILE}"
            -p "${SSH_PORT}"
          )
          # rsync -e tek bir string bekler; içindeki tüm değerler doğrulanmış
          # (port yalnız rakam, yollar $HOME altında sabit ve boşluksuz olmalı).
          case "${KEY_FILE}${KNOWN_HOSTS_FILE}" in
            *[[:space:]]*|*\'*|*\"*) echo "::error::SSH dosya yolu beklenmeyen karakter içeriyor."; exit 1 ;;
          esac
          RSYNC_RSH="ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=${KNOWN_HOSTS_FILE} -i ${KEY_FILE} -p ${SSH_PORT}"

          REMOTE_DIR="/home/${SSH_USER}/mustafa-ayverdi-blog/site"

          # Beyaz liste: yalnız yayınlanacak dosyalar temiz bir staging dizinine kopyalanır
          STAGING="$(mktemp -d)"
          chmod 755 "${STAGING}"
          trap 'rm -rf "${STAGING}"' EXIT
          for f in index.html 404.html kart.html iletisim.html gizlilik.html robots.txt sitemap.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Yayın dosyası eksik: $f"
              exit 1
            fi
            cp -p -- "$f" "${STAGING}/"
          done
          for d in css js assets notlar projeler; do
            if [ ! -d "$d" ]; then
              echo "::error::Yayın dizini eksik: $d/"
              exit 1
            fi
            cp -a -- "$d" "${STAGING}/"
          done
          # Savunma derinliği: staging içinde gizli/yedek/anahtar dosya kalmasın
          find "${STAGING}" -mindepth 1 \( -name '.*' -o -name '*.pem' -o -name '*.key' -o -name '*.bak' -o -name '*.sh' -o -name '*.md' \) -prune -exec rm -rf -- {} +

          ssh "${SSH_OPTS[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '${REMOTE_DIR}'"

          # Sunucuda elle konmuş /.well-known/ (ör. doğrulama dosyaları) --delete ile silinmesin
          rsync -avz --delete --delete-delay --delay-updates --max-delete=200 --filter='P /.well-known/' --chmod=D755,F644 \
            -e "${RSYNC_RSH}" \
            "${STAGING}/" "${SSH_USER}@${SSH_HOST}:${REMOTE_DIR}/"

      - name: Post-deploy health check
        shell: bash
        env:
          SITE_URL: https://blog.n8n-mustafa.me
        run: |
          set -euo pipefail
          check_status() {
            local url="$1" expected="$2" code
            if [ "${expected}" = "200" ]; then
              code="$(curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null -w '%{http_code}' "${url}")"
            else
              # 404 beklenen yanıt; --fail burada hata sayar, bu yüzden yalnız durum kodu okunur
              code="$(curl --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null -w '%{http_code}' "${url}" || true)"
            fi
            if [ "${code}" != "${expected}" ]; then
              echo "::error::${url} beklenen ${expected} yerine ${code} döndürdü."
              exit 1
            fi
            echo "${url} -> ${code}"
          }
          check_status "${SITE_URL}/" 200
          check_status "${SITE_URL}/assets/img/salonzeka-scene.jpg" 200
          check_status "${SITE_URL}/kart" 200
          check_status "${SITE_URL}/iletisim" 200
          check_status "${SITE_URL}/gizlilik" 200
          check_status "${SITE_URL}/assets/mustafa-ayverdi.vcf" 200
          check_status "${SITE_URL}/yok-boyle-sayfa-kontrol" 404

      - name: Clean up SSH key
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f ~/.ssh/deploy_key
